<!doctype html>
<html lang="fr" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>gestion depense</title>
    <!-- Bootstrap 5 CSS & Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/css/style.css" />
  </head>
  <body class="d-flex align-items-center py-4 min-vh-100">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-5">
          <div class="glass-card p-4 p-sm-5">
            <div class="text-center mb-4">
              <div
                class="logo-badge mx-auto mb-3"
                style="width: 56px; height: 56px; font-size: 1.8rem"
              >
                <i class="bi bi-wallet2"></i>
              </div>
              <h2 class="h3 fw-bold mb-1">
                Espace <span class="text-gradient">Connexion</span>
              </h2>
              <p class="text-muted small">
                Accédez à votre compte de gestion de depenses
              </p>
            </div>

            <!-- Zone d'alerte pour les erreurs -->
            <div
              id="alertBox"
              class="alert alert-danger d-none glass-card border-danger text-white mb-4"
              role="alert"
            ></div>

            <form id="loginFormPage">
              <div class="mb-3">
                <label
                  for="email"
                  class="form-label text-muted small fw-semibold"
                  >Adresse email</label
                >
                <div class="input-group">
                  <span
                    class="input-group-text bg-dark border-secondary text-muted"
                    ><i class="bi bi-envelope"></i
                  ></span>
                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    required
                    placeholder="nom@exemple.com"
                  />
                </div>
              </div>

              <div class="mb-4">
                <label
                  for="password"
                  class="form-label text-muted small fw-semibold"
                  >Mot de passe</label
                >
                <div class="input-group">
                  <span
                    class="input-group-text bg-dark border-secondary text-muted"
                    ><i class="bi bi-lock"></i
                  ></span>
                  <input
                    type="password"
                    class="form-control"
                    id="password"
                    required
                    placeholder="Votre mot de passe"
                  />
                  <button
                    class="btn btn-outline-secondary text-muted bg-dark border-secondary"
                    type="button"
                    onclick="togglePasswordVisibility('password', 'togglePassIcon')"
                    title="Afficher/Masquer le mot de passe"
                  >
                    <i class="bi bi-eye-slash" id="togglePassIcon"></i>
                  </button>
                </div>
              </div>

              <button
                type="submit"
                class="btn btn-stitch-primary w-100 py-2-5 justify-content-center"
              >
                <i class="bi bi-box-arrow-in-right"></i> Se connecter
              </button>
            </form>

            <div class="text-center mt-4">
              <a
                href="/index.html"
                class="text-gradient text-decoration-none small"
                ><i class="bi bi-arrow-left me-1"></i> Retour à l'application
                principale</a
              >
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Script JavaScript -->
    <script>
      const loginForm = document.getElementById("loginFormPage");
      const alertBox = document.getElementById("alertBox");

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        alertBox.classList.add("d-none");

        const email = document.getElementById("email").value;
        const motDePasse = document.getElementById("password").value;

        try {
          const response = await fetch("http://localhost:3000/api/connexion", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, motDePasse }),
          });

          const data = await response.json();

          if (response.ok && data.success) {
            localStorage.setItem("token", data.token);
            localStorage.setItem("userId", data.utilisateur.id);
            window.location.href = "index.html";
          } else {
            alertBox.textContent = data.message || "Identifiants invalides.";
            alertBox.classList.remove("d-none");
          }
        } catch (error) {
          console.error("Erreur réseau :", error);
          alertBox.textContent = "Impossible de contacter le serveur backend.";
        }
      });

      function togglePasswordVisibility(inputId, iconId) {
        const input = document.getElementById(inputId);
        const icon = document.getElementById(iconId);
        if (!input || !icon) return;

        if (input.type === 'password') {
          input.type = 'text';
          icon.classList.remove('bi-eye-slash');
          icon.classList.add('bi-eye');
        } else {
          input.type = 'password';
          icon.classList.remove('bi-eye');
          icon.classList.add('bi-eye-slash');
        }
      }
    </script>
  </body>
</html>
